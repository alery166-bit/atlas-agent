    /* VISUAL POLISH 2.0 — unified product surface */
    :root{--bg:#f1f4f6;--surface:#ffffff;--surface2:#f7f9fb;--ink:#162033;--text:#364152;--muted:#6f7a8a;--faint:#9ca6b4;--line:#e4e8ee;--line2:#d5dbe4;--blue:#3f5ff5;--blue2:#2f4cda;--blueSoft:#eef1ff;--nav:#151c28;--nav2:#1d2635;--shadow:0 18px 50px rgba(31,45,72,.08);--radius:15px}
    ::selection{background:#dce3ff;color:#192a70}
    body{background:var(--bg);letter-spacing:.005em}
    .app{grid-template-columns:252px minmax(0,1fr)}
    .sidebar{position:relative;background:linear-gradient(180deg,#141b27 0%,#192231 58%,#151d29 100%);border-right:1px solid rgba(255,255,255,.04);box-shadow:10px 0 35px rgba(18,27,43,.09)}
    .sidebar:after{content:"";position:absolute;inset:0 0 auto;height:180px;pointer-events:none;background:radial-gradient(circle at 20% 0,rgba(84,109,255,.16),transparent 65%)}
    .brand{position:relative;z-index:1;height:72px;padding:0 19px;border-bottom-color:rgba(255,255,255,.07);font-size:13px;letter-spacing:-.01em}
    .brand-mark{width:31px;height:31px;border-radius:10px 10px 10px 4px;background:#526df8;color:white;box-shadow:0 7px 18px rgba(61,87,239,.33)}
    .nav-scroll{position:relative;z-index:1;padding:18px 12px 24px}
    .nav-group{margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.055)}
    .nav-group:last-child{border-bottom:0}
    .nav-label{padding:0 11px 8px;color:#6f7b8b;font-size:8px;letter-spacing:.17em}
    .nav-item{position:relative;gap:11px;margin:3px 0;padding:10px 11px;border-radius:10px;color:#aeb8c7;font-size:11px;overflow:hidden}
    .nav-item:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:0 2px 2px 0;background:#6e83ff;opacity:0;transform:translateX(-2px);transition:.18s}
    .nav-item:hover{background:rgba(255,255,255,.055);color:#f7f9fc}
    .nav-item.active{background:linear-gradient(90deg,rgba(84,109,248,.2),rgba(84,109,248,.09));color:white;box-shadow:inset 0 0 0 1px rgba(111,134,255,.13)}
    .nav-item.active:before{opacity:1;transform:none}

  <style id="atlas-theme-controls">
    .theme-select{
      width:132px;height:35px;padding:0 28px 0 10px;color:var(--text);border:1px solid var(--line2);
      border-radius:7px;background:var(--surface2);font:700 11px/1 Inter,"Microsoft YaHei",sans-serif;
      outline:0;cursor:pointer
    }
    .theme-select:hover,.theme-select:focus{border-color:var(--blue)}
    .review-page{padding:22px;min-height:100%;background:var(--bg)}
    .review-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
    .review-workbench{display:grid;grid-template-columns:260px minmax(430px,1fr) 340px;gap:12px;min-height:650px}
    .review-column{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius,10px);overflow:hidden}
    .review-column-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 15px;border-bottom:1px solid var(--line);background:var(--surface2)}
    .review-column-title{font-size:13px;font-weight:800;color:var(--text)}
    .review-column-copy{font-size:11px;color:var(--muted);margin-top:3px}
    .review-queue{padding:8px}
    .queue-item{width:100%;text-align:left;padding:12px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);cursor:pointer;margin-bottom:5px}
    .queue-item:hover{background:var(--surface2);border-color:var(--line)}
    .queue-item.active{background:color-mix(in srgb,var(--blue) 10%,var(--surface));border-color:color-mix(in srgb,var(--blue) 35%,var(--line))}
    .queue-title{font-size:12px;font-weight:800;line-height:1.45}
    .queue-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;margin-top:7px}
    .review-main{padding:15px}
    .review-company{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:13px;border-bottom:1px solid var(--line)}
    .review-company h2{font-size:17px;margin:0 0 5px}
    .review-id{font-size:11px;color:var(--muted)}
    .review-tabs{display:flex;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
    .review-tab{padding:7px 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11px;font-weight:750;cursor:pointer}
    .review-tab.active{background:var(--surface2);color:var(--text)}
    .review-pane{display:none;padding-top:14px}
    .review-pane.active{display:block}
    .finding-review{padding:13px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
    .finding-review-top{display:flex;align-items:center;gap:8px}
    .finding-review h3{font-size:13px;margin:0}
    .finding-review p{font-size:12px;line-height:1.65;color:var(--muted);margin:8px 0 10px}
    .review-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .review-field{display:flex;flex-direction:column;gap:5px;font-size:10px;color:var(--muted)}
    .review-field .field,.review-field .select{width:100%;min-width:0}
    .score-adjust{display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;gap:12px;margin-bottom:14px}
    .score-box{padding:16px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);text-align:center}
    .score-box span{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}
    .score-box strong{font-size:26px}
    .score-arrow{text-align:center;color:var(--muted);font-size:20px}
    .report-diff{border:1px solid var(--line);border-radius:8px;overflow:hidden}
    .diff-head,.diff-row{display:grid;grid-template-columns:1fr 1fr}
    .diff-head{background:var(--surface2);font-size:11px;font-weight:800}
    .diff-head div,.diff-row>div{padding:10px 12px;border-right:1px solid var(--line)}
    .diff-head div:last-child,.diff-row>div:last-child{border-right:0}
    .diff-row{font-size:11px;line-height:1.7;border-top:1px solid var(--line)}
    .diff-old{color:var(--muted)}
    .diff-old del{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red);text-decoration:none}
    .diff-new ins{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green);text-decoration:none}
    .evidence-pane{padding:12px}
    .freshness-table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:12px}
    .freshness-table th,.freshness-table td{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line)}
    .freshness-table th{color:var(--muted);font-weight:700}
    .evidence-card{padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:9px}
    .evidence-source{font-size:10px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
    .evidence-card h4{font-size:12px;line-height:1.5;margin:6px 0}
    .evidence-card p{font-size:11px;line-height:1.6;color:var(--muted);margin:0}
    .evidence-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;font-size:9px;color:var(--muted)}
    .review-actions{display:flex;gap:7px;justify-content:flex-end;padding:12px 15px;border-top:1px solid var(--line);background:var(--surface2)}
    .admin-hub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .admin-card{padding:17px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;color:var(--text)}
    .admin-card:hover{border-color:var(--blue);transform:translateY(-1px)}
    .admin-card-icon{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--surface2);font-size:11px;font-weight:850;color:var(--blue)}
    .admin-card h3{font-size:13px;margin:12px 0 5px}
    .admin-card p{font-size:11px;line-height:1.55;color:var(--muted);margin:0}
    .attach-report{height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:7px;background:var(--surface2);color:var(--text);font-size:11px;font-weight:750;cursor:pointer}
    .attach-report:hover{border-color:var(--blue)}
    .source-freshness{display:block;color:var(--muted);font-size:10px;margin-top:5px}
    @media(max-width:1040px){.theme-select{width:102px}.system-live{display:none}}
    @media(max-width:1280px){.review-workbench{grid-template-columns:230px minmax(390px,1fr) 300px}.admin-hub{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:1040px){.review-workbench{grid-template-columns:220px 1fr}.review-evidence-column{grid-column:1/-1}.review-summary{grid-template-columns:repeat(2,1fr)}}

    @media(max-width:760px){.review-page{padding:14px}.review-workbench{grid-template-columns:1fr}.review-evidence-column{grid-column:auto}.admin-hub,.review-summary{grid-template-columns:1fr}.review-fields{grid-template-columns:1fr}}

<body>

  <script>
    const state={page:'agent'};
    const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
    const pageNames={agent:'业务工作台 / Agent 对话',tasks:'业务工作台 / 调查任务',review:'业务工作台 / 待办研判',companies:'业务工作台 / 企业档案',reports:'业务工作台 / 报告中心',admin:'系统 / 管理后台',skills:'管理后台 / Skills',tools:'管理后台 / 工具',strategies:'管理后台 / 任务策略',sources:'管理后台 / 数据源',rules:'管理后台 / 规则与评分',templates:'管理后台 / 报告模板',models:'管理后台 / 模型配置',evaluations:'管理后台 / 评测中心',monitoring:'管理后台 / 运行监控',audit:'管理后台 / 操作日志',access:'管理后台 / 用户与权限'};
    const status=(text,tone='gray')=>`<span class="status ${tone}"><i class="dot"></i>${text}</span>`;
    const metric=(label,value,meta,tone='')=>`<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-meta ${tone}">${meta}</div></div>`;
    const pageHead=(title,desc,actions='')=>`<header class="page-head"><div><h1 class="page-title">${title}</h1><p class="page-desc">${desc}</p></div><div class="head-actions">${actions}</div></header>`;
    const action=(label,kind='',name='generic')=>`<button class="btn ${kind}" data-action="${name}">${label}</button>`;

    function agentPage(){return `<section class="agent-page"><div class="agent-chat" id="agentChat"><div class="date">今天 · 企业调查任务</div><div class="turn user"><div class="user-bubble">调查北京童程童慧科技有限公司近一年的经营状况，重点核实失联、拖欠工资和门店关闭，并更新原风险报告。</div></div><div class="turn"><div class="agent-avatar">A</div><div><div class="agent-name">Atlas · 调查中</div><div class="prose"><p>已确认企业主体。我正在比较原报告与最新工商信息，同时查询内部风险记录、权威企业数据和公开舆情。未核验信息不会写成确定结论。</p></div><details class="activity"><summary>查看 Agent 执行过程</summary><div class="activity-body">✓ 企业主体识别：统一社会信用代码已确认<br>✓ 权威企业数据：工商与标准风险查询完成<br>✓ 内部 ES：历史标签与原报告读取完成<br>✓ 公开舆情：近 12 个月结果已去重<br>● 证据核验：2 项主体归属需要人工判断</div></details></div></div><div class="turn"><div class="agent-avatar">A</div><div><div class="agent-name">Atlas · 初步结论</div><div class="result"><div class="result-head"><div><div class="result-kicker">风险调查摘要</div><h3>发现 3 项重点经营风险</h3><div class="result-meta">北京童程童慧科技有限公司 · 截止 2026-07-15</div></div><div class="score">风险评分<strong>9.8</strong>原报告已人工调整</div></div><div class="result-summary">当前建议维持高风险。失联风险已有多来源支持；拖欠工资和门店关闭仍需完成主体及处理状态核验。</div><div class="finding"><i class="severity"></i><div><div class="finding-title">失联风险 ${status('高关注','red')}</div><div class="finding-copy">多个公开联系方式无法接通，历史数据存在失联标签，三项来源指向同一主体。</div></div><button class="citation">证据 [1–3]</button><div class="evidence-inline">[1] 国家企业信用信息公示系统 · 主体已核验<br>[2] 权威企业数据 · 联系方式变更<br>[3] 内部 ES · 历史失联标签，部分可追溯</div></div><div class="finding"><i class="severity amber"></i><div><div class="finding-title">拖欠工资 ${status('待确认','amber')}</div><div class="finding-copy">近九十天出现多起相关投诉，投诉主体与经营门店关联度较高。</div></div><button class="citation">证据 [4–5]</button><div class="evidence-inline">[4] 投诉平台 · 欠薪投诉摘要<br>[5] 内部风险监测 · 处置状态待核验</div></div><div class="finding"><i class="severity amber"></i><div><div class="finding-title">门店关闭 ${status('主体待核验','amber')}</div><div class="finding-copy">五家门店关闭或注销，其中两家与目标主体关系明确，其余可能属于关联品牌。</div></div><button class="citation">证据 [6–8]</button><div class="evidence-inline">[6] 公开新闻 · 门店关闭报道<br>[7] 门店页面 · 已核验 2 家<br>[8] 投诉平台 · 关联关系待确认</div></div><div class="result-foot"><small>证据可追溯 8 / 10 · 8 个来源</small><div class="button-group">${action('继续追问','','focusPrompt')}${action('生成风险提示报告','primary','generateReport')}</div></div></div></div></div><div class="turn"><div class="agent-avatar">A</div><div><div class="agent-name">Atlas · 需要确认</div><div class="panel"><div class="panel-body"><div style="font-size:13px;color:var(--amber);font-weight:750;margin-bottom:7px">主体归属存在不确定性</div><div class="prose"><p>两条关店信息可能属于关联企业。是否继续展开股东、品牌和分支机构关系？</p></div><div class="button-group">${action('展开调查','primary','confirmExpand')}${action('暂不展开','','skipExpand')}</div></div></div></div></div></div><div class="composer-dock"><div class="composer-shell"><div class="prompt-chips"><button class="chip" data-prompt="只看旧报告之后新增的风险。">只看新增风险</button><button class="chip" data-prompt="展开关联企业并判断风险是否传导。">展开关联企业</button><button class="chip" data-prompt="解释风险评分为什么是 9.8。">解释风险评分</button><button class="chip" data-prompt="从招商角度评估这家企业是否值得跟进。">评估招商价值</button></div><div class="composer"><textarea id="agentPrompt" placeholder="继续追问、补充要求，或输入新的企业调查任务…"></textarea><button class="send" id="sendPrompt">↑</button></div><div class="composer-note">Atlas 可能犯错；正式结论需经过人工复核</div></div></div></section>`}

    function tasksPage(){return `<section class="page narrow">${pageHead('调查任务','管理所有 Agent 调查、人工确认和报告生成过程。',action('新建调查','primary','newTask'))}<div class="metrics">${metric('进行中','12','较昨日 +3','good')}${metric('等待人工确认','7','其中 2 项超过 24 小时','warn')}${metric('本月已完成','186','平均耗时 18 分钟','good')}${metric('报告生成成功率','97.8%','较上月 +1.4%','good')}</div><div class="toolbar"><input class="field" placeholder="搜索任务或企业"><select class="select"><option>全部状态</option><option>进行中</option><option>待确认</option><option>已完成</option></select><select class="select"><option>全部任务类型</option><option>风险调查</option><option>招商分析</option><option>复合任务</option></select><span class="spacer"></span>${action('导出列表','','export')}</div><div class="panel table-wrap"><table class="table"><thead><tr><th>任务</th><th>企业</th><th>Agent识别意图</th><th>状态</th><th>进度</th><th>发起人</th><th>更新时间</th></tr></thead><tbody><tr data-open="任务详情"><td>#AT-20260722-0186</td><td><b>北京童程童慧科技有限公司</b></td><td>风险报告更新</td><td>${status('等待确认','amber')}</td><td><div class="progress amber"><span style="width:78%"></span></div></td><td>王晨</td><td>5分钟前</td></tr><tr data-open="任务详情"><td>#AT-20260722-0185</td><td><b>乾道投资控股集团有限公司</b></td><td>风险调查</td><td>${status('调查中','blue')}</td><td><div class="progress"><span style="width:56%"></span></div></td><td>李宁</td><td>12分钟前</td></tr><tr><td>#AT-20260722-0182</td><td><b>华北智造科技有限公司</b></td><td>招商线索分析</td><td>${status('已完成','green')}</td><td><div class="progress green"><span style="width:100%"></span></div></td><td>赵可</td><td>1小时前</td></tr><tr><td>#AT-20260722-0179</td><td><b>中关村数据服务有限公司</b></td><td>企业概览</td><td>${status('已完成','green')}</td><td><div class="progress green"><span style="width:100%"></span></div></td><td>王晨</td><td>2小时前</td></tr><tr><td>#AT-20260721-0164</td><td><b>京南新能源产业有限公司</b></td><td>复合任务</td><td>${status('数据源异常','red')}</td><td><div class="progress amber"><span style="width:42%"></span></div></td><td>系统批次</td><td>昨天</td></tr></tbody></table></div></section>`}

    function companiesPage(){return `<section class="page narrow">${pageHead('企业档案','同一企业的事实底稿、历史调查、风险事件和报告版本。',action('关注企业','primary','followCompany'))}<div class="company-hero"><div><h2 class="company-name">北京童程童慧科技有限公司</h2><div class="company-meta"><span>${status('存续','green')}</span><span>统一社会信用代码：91110108MA01Q4K25F</span><span>更新至 2026-07-15</span><span>北京市海淀区</span></div></div><div class="risk-ring"><span><strong>9.8</strong>风险评分</span></div></div><div class="tabs"><button class="tab active">企业概览</button><button class="tab">股东与人员</button><button class="tab">经营动态</button><button class="tab">风险事件</button><button class="tab">关联关系</button><button class="tab">调查历史</button></div><div class="grid-2"><div class="panel"><div class="panel-head"><div><div class="panel-title">工商基本信息</div><div class="panel-subtitle">来源：权威企业数据 · T+1</div></div>${action('查看全部','','openCompany')}</div><div class="panel-body"><div class="fact-list"><div class="fact"><span class="fact-label">法定代表人</span><b>李明</b></div><div class="fact"><span class="fact-label">注册资本</span><b>500 万元</b></div><div class="fact"><span class="fact-label">成立日期</span><b>2019-03-12</b></div><div class="fact"><span class="fact-label">经营状态</span><b>存续</b></div><div class="fact"><span class="fact-label">股东数量</span><b>3</b></div><div class="fact"><span class="fact-label">分支机构</span><b>18</b></div></div></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">近期变化</div><div class="panel-subtitle">与上次调查快照对比</div></div>${status('3 项新增','red')}</div><div class="panel-body"><div class="timeline"><div class="event"><div class="event-title">新增门店关闭线索</div><div class="event-copy">2 家已确认属于目标企业，3 家仍在核验关联关系。</div><div class="event-date">2026-07-14</div></div><div class="event"><div class="event-title">新增欠薪投诉</div><div class="event-copy">投诉主体匹配，处理状态尚未同步。</div><div class="event-date">2026-07-13</div></div><div class="event"><div class="event-title">主要人员发生变更</div><div class="event-copy">新增一名监事，不影响当前实控关系。</div>       const send=$('#sendPrompt'),input=$('#agentPrompt');if(send&&input){send.addEventListener('click',()=>sendPrompt());input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendPrompt()}})}
    }
    function sendPrompt(p){const input=$('#agentPrompt');const text=(p||(input&&input.value)||'').trim();if(!text)return;const chat=$('#agentChat');chat.insertAdjacentHTML('beforeend',`<div class="turn user"><div class="user-bubble"></div></div><div class="turn"><div class="agent-avatar">A</div><div><div class="agent-name">Atlas</div><div class="prose"><p>已收到。我会将这项要求加入当前调查，并更新相关结论、证据范围和报告草稿。</p></div></div></div>`);const bubbles=$$('.user-bubble',chat);bubbles[bubbles.length-1].textContent=text;if(input)input.value='';$('#pageHost').scrollTo({top:$('#pageHost').scrollHeight,behavior:'smooth'})}
    function handleAction(name,label){if(name==='gotoReports'){render('reports');return}if(name==='gotoReview'){render('review');return}if(name==='focusPrompt'){const i=$('#agentPrompt');if(i)i.focus();return}if(name==='attachReport'){toast('旧报告已选择：企业风险监测分析报告_v2.docx');return}if(name==='generateReport'){const chat=$('#agentChat');chat.insertAdjacentHTML('beforeend',`<div class="turn"><div class="agent-avatar">A</div><div><div class="agent-name">Atlas · 报告已生成</div><div class="panel"><div class="panel-body"><div class="entity"><span class="entity-icon">DOC</span><div><div class="entity-name">北京童程童慧科技有限公司_风险提示报告_草稿.docx</div><div class="entity-meta">草稿 · 8 项证据 · 尚未提交人工复核</div></div><span class="spacer"></span><button class="btn small">预览</button></div></div></div></div></div>`);$('#pageHost').scrollTo({top:$('#pageHost').scrollHeight,behavior:'smooth'});return}if(name==='confirmExpand'||name==='skipExpand'){toast(name==='confirmExpand'?'已记录：展开关联主体调查':'已记录：暂不展开');return}if(name==='submitSecondReview'){toast('已保存复核意见并提交二审');return}if(name==='saveReview'){toast('复核草稿已保存');return}if(name==='requestMore'){toast('已退回 Agent 补充调查，当前意见已保留');return}if(['editSkill','newSkill','newTool','configure','newStrategy','editStrategy','newSource','configureSource','editThreshold','newRuleDraft','templateFields','editTemplate','addModel','editRouting','editAccess','inviteUser','previewReport','newReport','newTask','openCompany','ruleChanges','manageDataset','reviewGuide'].includes(name)){openDrawer(label);return}if(name==='runEval'){toast('完整评测已进入运行队列');return}toast(`${label}（原型交互）`)}
    function handleActionV12(name,label,e){if(name==='finalizeDocx'){toast('人工分和研判结果已保存，正在使用 V1 模板生成正式 DOCX');return}if(name==='saveReview'){toast('研判草稿已保存');return}return handleAction(name,label,e)}
    const themeSelect=$('#themeSelect'),themeStyles={editorial:$('#atlas-editorial-theme'),arctic:$('#atlas-arctic-theme'),graphite:$('#atlas-graphite-theme'),jade:$('#atlas-jade-theme')},themeNames={arctic:'冰川运营风',jade:'墨玉政企风'};function applyTheme(theme,notify=false){const next=themeNames[theme]?theme:'arctic';Object.entries(themeStyles).forEach(([name,style])=>style.disabled=name!==next);themeSelect.value=next;localStorage.setItem('atlas-theme',next);if(notify)toast(`已切换为${themeNames[next]}`)}applyTheme(localStorage.getItem('atlas-theme')||'arctic');themeSelect.addEventListener('change',e=>applyTheme(e.target.value,true));
    $$('.nav-item').forEach(b=>b.addEventListener('click',()=>render(b.dataset.page)));$('#menuButton').addEventListener('click',()=>$('#sidebar').classList.add('open'));$('#overlay').addEventListener('click',closeDrawer);$('#closeDrawer').addEventListener('click',closeDrawer);$('#cancelDrawer').addEventListener('click',closeDrawer);$('#saveDrawer').addEventListener('click',()=>{closeDrawer();toast('配置已保存为草稿')});$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){toast(`正在搜索：${e.target.value||'全部内容'}`)}});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}if(e.key==='Escape')closeDrawer()});window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p&&p!==state.page)render(p)});render(location.hash.slice(1)||'agent');
  </script>
